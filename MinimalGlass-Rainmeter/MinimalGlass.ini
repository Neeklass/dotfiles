[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=MinimalGlass
Author=Niklas
Information=Minimal dark glass status widget for Rainmeter
Version=0.1.0

[Variables]
FontName=Segoe UI
TextColor=242,243,245,255
MutedColor=162,167,176,255
BorderColor=255,255,255,24
PanelColor=16,18,22,105
Width=245
Height=238

[MeasureGlass]
Measure=Plugin
Plugin=FrostBehind
Type=Acrylic
Corner=Round

[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureDate]
Measure=Time
Format=%A  %d.%m.%Y

[MeasureCPU]
Measure=CPU
Processor=0

[MeasureRAM]
Measure=PhysicalMemory
UpdateDivider=2

[MeasureNetIn]
Measure=NetIn
Interface=Best

[MeasureNetOut]
Measure=NetOut
Interface=Best

[Background]
Meter=Shape
Shape=Rectangle 0,0,#Width#,#Height#,16 | Fill Color #PanelColor# | StrokeWidth 1 | Stroke Color #BorderColor#
AntiAlias=1

[Time]
Meter=String
MeasureName=MeasureTime
X=20
Y=16
FontFace=#FontName#
FontSize=24
FontWeight=600
FontColor=#TextColor#
AntiAlias=1

[Date]
Meter=String
MeasureName=MeasureDate
X=21
Y=52
FontFace=#FontName#
FontSize=9
FontColor=#MutedColor#
AntiAlias=1

[Divider1]
Meter=Shape
Shape=Line 20,82,225,82 | StrokeWidth 1 | Stroke Color 255,255,255,20
AntiAlias=1

[CPULabel]
Meter=String
X=20
Y=98
Text=CPU
FontFace=#FontName#
FontSize=10
FontColor=#MutedColor#
AntiAlias=1

[CPUValue]
Meter=String
MeasureName=MeasureCPU
X=225
Y=98
StringAlign=Right
Text=%1%
FontFace=#FontName#
FontSize=10
FontColor=#TextColor#
AntiAlias=1

[RAMLabel]
Meter=String
X=20
Y=126
Text=MEMORY
FontFace=#FontName#
FontSize=10
FontColor=#MutedColor#
AntiAlias=1

[RAMValue]
Meter=String
MeasureName=MeasureRAM
X=225
Y=126
StringAlign=Right
Percentual=1
Text=%1%
FontFace=#FontName#
FontSize=10
FontColor=#TextColor#
AntiAlias=1

[Divider2]
Meter=Shape
Shape=Line 20,158,225,158 | StrokeWidth 1 | Stroke Color 255,255,255,20
AntiAlias=1

[DownloadLabel]
Meter=String
X=20
Y=176
Text=DOWN
FontFace=#FontName#
FontSize=9
FontColor=#MutedColor#
AntiAlias=1

[DownloadValue]
Meter=String
MeasureName=MeasureNetIn
X=225
Y=176
StringAlign=Right
AutoScale=1
NumOfDecimals=1
Text=%1B/s
FontFace=#FontName#
FontSize=9
FontColor=#TextColor#
AntiAlias=1

[UploadLabel]
Meter=String
X=20
Y=203
Text=UP
FontFace=#FontName#
FontSize=9
FontColor=#MutedColor#
AntiAlias=1

[UploadValue]
Meter=String
MeasureName=MeasureNetOut
X=225
Y=203
StringAlign=Right
AutoScale=1
NumOfDecimals=1
Text=%1B/s
FontFace=#FontName#
FontSize=9
FontColor=#TextColor#
AntiAlias=1
